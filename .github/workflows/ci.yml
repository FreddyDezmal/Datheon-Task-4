# Builds and tests everything on every push to main and every pull request.
#
# Render's "After CI Checks Pass" auto-deploy waits for every check on a commit, so these jobs gate
# production deploys: a commit is deployed only when all of them pass. Keep anything that can fail
# for reasons outside the commit (newly published advisories, scanner updates) in security.yml.
# See Documentation/Testing.md, "Continuous integration".

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token; nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; runs on main always finish, so every deployed commit has a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # A disposable server for the PostgreSQL tests; each test creates and drops its own database.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-throwaway-container-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # NuGet's vulnerability audit runs here. TreatWarningsAsErrors turns its warnings into errors,
      # so a package with a known advisory fails the build (as it would fail Render's Docker build).
      - name: Restore
        run: dotnet restore backend/Storefront.slnx

      - name: Build
        run: dotnet build backend/Storefront.slnx --configuration Release --no-restore

      - name: Test
        env:
          STOREFRONT_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=ci-throwaway-container-only
        run: >-
          dotnet test backend/Storefront.slnx --configuration Release --no-build
          --logger "trx;LogFilePrefix=backend" --results-directory backend/TestResults

      # dotnet test passes with skipped tests; the PostgreSQL tests skip when their server is missing.
      - name: Every test ran
        run: python3 tools/ci/check_test_results.py backend/TestResults 416

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: backend/TestResults/**/*.trx
          retention-days: 14

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Only React and React DOM ship to browsers; an advisory against them blocks the deploy.
      # Development tooling is audited weekly in security.yml instead.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      # Also enforces the coverage thresholds in vite.config.ts.
      - name: Unit and component tests
        run: npm run test:coverage

      # Built exactly as the Render Static Site builds it.
      - name: Production build
        env:
          VITE_API_BASE_URL: https://datheon-task-4.onrender.com
        run: npm run build

      - name: Bundle has no source maps or local addresses
        run: |
          if find dist -name '*.map' | grep -q .; then echo "Source maps in dist/"; exit 1; fi
          if grep -rlE 'localhost|127\.0\.0\.1' dist; then echo "A local address is in the bundle"; exit 1; fi
          echo "dist/ is clean."

  e2e:
    name: Browser tests (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # dev: the Vite dev server. production: the built bundle under the site's security headers.
        mode: [dev, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Built before Playwright starts it, so the server's start-up timeout isn't spent compiling.
      - name: Build the API
        run: dotnet build backend/Storefront.Api --configuration Debug

      # The headless shell only (what headless runs use), cached per Playwright version. No --with-deps:
      # the runner image already has every library Chromium needs, and the apt step it adds (fonts and
      # Xvfb this suite doesn't use) once took 7 minutes on a slow mirror. A missing library would make
      # the browser fail to launch, so this can't pass silently.
      - name: Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --only-shell chromium

      - name: Run
        working-directory: frontend
        env:
          E2E_PRODUCTION_BUILD: ${{ matrix.mode == 'production' && '1' || '0' }}
          E2E_API_COMMAND: dotnet run --no-build --project backend/Storefront.Api --no-launch-profile
        run: npx playwright test

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.mode }}
          path: |
            frontend/playwright-report/
            frontend/e2e/.results/
          retention-days: 14

  image:
    name: Container image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Dockerfile and context Render builds; --pull uses the current base images.
      - name: Build
        run: docker build --pull --tag storefront-api:ci backend

      # Fails if the API is missing, or if the development settings slipped in (Security-Audit.md, SA-15).
      - name: Image contents
        run: >-
          docker run --rm --entrypoint sh storefront-api:ci -c
          'test -f /app/Storefront.Api.dll && test ! -e /app/appsettings.Development.json && echo "Image contents OK"'

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history: a secret removed in a later commit is still exposed

      # Downloaded and checked against a pinned checksum, rather than run as a third-party action.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # Findings are redacted in the log. Reviewed false positives are listed in .gitleaksignore.
      - name: Scan
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose'
