# Weekly vulnerability scans of dependencies and the container image.
#
# Kept out of ci.yml on purpose: these results change when advisories are published, not when the code
# does, so they don't gate deploys. A scheduled run that fails emails the repository owner. Fix by
# updating the package, or by rebuilding the image ("Clear build cache & deploy" on Render) for base-image
# patches. Run it by hand from the Actions tab ("Run workflow") after a dependency change.

name: Security scan

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC (07:17 in Johannesburg)
  pull_request:
    paths:
      - 'backend/**/*.csproj'
      - 'backend/Dockerfile'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/security.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Restore without the audit, so the report below lists every vulnerable package, not just the first error.
      - name: NuGet packages, including transitive ones
        run: |
          dotnet restore backend/Storefront.slnx -p:NuGetAudit=false
          dotnet list backend/Storefront.slnx package --vulnerable --include-transitive | tee "$RUNNER_TEMP/nuget.txt"
          if grep -q 'has the following vulnerable packages' "$RUNNER_TEMP/nuget.txt"; then exit 1; fi

      # Everything, development tooling included; high and critical advisories fail.
      # (ci.yml already blocks any advisory against the shipped React packages.)
      - name: npm packages
        working-directory: frontend
        run: npm audit --audit-level=high

  image:
    name: Container image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # 0.69.4 was a compromised release (CVE-2026-33634). Pinned to a later one by checksum.
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build --pull --tag storefront-api:scan backend

      - name: Install Trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy

      # Fails on high or critical vulnerabilities that have a fix available: those a rebuild or update would remove.
      - name: Scan
        run: >-
          "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 --no-progress storefront-api:scan
